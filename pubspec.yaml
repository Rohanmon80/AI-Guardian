name: ai_guardian
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.4.0
  geolocator: ^14.0.3
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/ai_guardian_logo.png
    - assets/images/ai_guardian_app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ai_guardian_app_icon.png"
  adaptive_icon_background: "#07090D"
  adaptive_icon_foreground: "assets/images/ai_guardian_app_icon.png"